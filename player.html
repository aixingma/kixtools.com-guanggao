<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M3U8 在线播放器</title>
  <meta name="robots" content="noindex">
  <link href="https://web.sdk.qcloud.com/player/tcplayer/release/v5.1.0/tcplayer.min.css" rel="stylesheet">
  <script src="https://web.sdk.qcloud.com/player/tcplayer/release/v5.1.0/tcplayer.v5.1.0.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; }
    #player-container-id { width: 100%; height: 100%; display: block; }
    .watermark {
      position: fixed; top: 12px; right: 12px; z-index: 1000;
      background: rgba(0,0,0,0.35); color: #fff; padding: 6px 12px;
      border-radius: 4px; font-size: 13px;
    }
    .watermark a { color: #60a5fa; text-decoration: none; }
  </style>
  <script src="/js/config.js"></script>
</head>
<body>
<video id="player-container-id" preload="auto" playsinline webkit-playsinline></video>
<div class="watermark"><a href="https://kixtools.com/" target="_blank" rel="noopener">kixtools.com</a></div>
<script>
  function getUrlParam(name) {
    var r = window.location.search.substr(1).match(new RegExp('(^|&)' + name + '=([^&]*)(&|$)'));
    if (r != null) return decodeURIComponent(r[2]);
    return null;
  }
  var url = getUrlParam('url');
  if (url) {
    var player = TCPlayer('player-container-id', {
      sources: [{ src: url }],
      licenseUrl: window.SITE_CONFIG.licenseUrl,
      licenseKey: window.SITE_CONFIG.licenseKey,
    });
    player.src(url);
  }
</script>
</body>
</html>
